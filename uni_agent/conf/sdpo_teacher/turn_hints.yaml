# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Per-turn reflector hints: the teacher scores each hinted turn on [context<t + hint], one
# spliced sub-row per hint. Select with hydra.searchpath=[pkg://uni_agent.conf] and
# sdpo_teacher@actor_rollout_ref.actor.self_distillation.teacher=turn_hints.

# The teacher class; the other keys are its keyword options
_target_: uni_agent.sdpo.TurnHintTeacher

# Template for one injected hint; spliced immediately before the hinted turn's tokens.
# The splice is a real user turn, so any instruction in it is what the teacher answers:
# "Thank you for the guidance" opened 9.9% of scored turns, "Act on this directly in your next
# tool call" took bare-call turns from 2.3% to 91% in five steps, and the no-acknowledgement
# wording after them was still quoted ("The guidance says") in 14 of 37 regenerated teacher
# turns. A bare note carrying a hint of at most 12 words was referred to in 2 of 37.
turn_hint_template: "Note: {hint}"

# Rollout-side apply_chat_template kwargs, mirrored when deriving header/hint fragments
# (e.g. {enable_thinking: false} for Qwen3.5); must match the agent config's value
chat_template_kwargs: {}

# Tokens at the start of each hinted turn left out of the distillation mask. Any hint, even one
# from another trace, moves the base teacher's first token from reacting to the last output
# ("So", "Perfect") toward announcing ("Let", "Wait"), a content-free push that adds up over
# steps; the first 8 tokens hold 35% of the hinted turn's KL and as much of its hint-specific
# part. 0 scores the whole turn.
skip_first_tokens: 0
